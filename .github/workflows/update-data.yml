name: Collect and validate game data

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

# Collection cannot publish, modify main, or bypass its required review.
permissions:
  contents: read

concurrency:
  group: game-data-candidate
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect a complete candidate
        run: npm run data:collect -- .cache/data-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: collected-game-data
          path: .cache/data-candidate/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: collected-game-data
          path: .cache/data-candidate
      - name: Validate schema, counts, and probability references
        run: npm run data:validate -- .cache/data-candidate
      - name: Apply candidate to the isolated validation checkout
        run: npm run data:apply -- .cache/data-candidate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: validated-game-data
          path: .cache/data-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Record publication boundary
        run: |
          echo '검증된 후보: validated-game-data. data:apply 후 변경을 검토하여 main에 반영하면 Vercel이 배포합니다.' >> "$GITHUB_STEP_SUMMARY"
